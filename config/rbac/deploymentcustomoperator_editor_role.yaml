# This rule is not used by the project deployment-custom-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dpscaler.sarthak.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deployment-custom-operator
    app.kubernetes.io/managed-by: kustomize
  name: deploymentcustomoperator-editor-role
rules:
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators/status
  verbs:
  - get
