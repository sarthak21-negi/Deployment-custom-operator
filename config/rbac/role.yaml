---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators/finalizers
  verbs:
  - update
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators/status
  verbs:
  - get
  - patch
  - update
