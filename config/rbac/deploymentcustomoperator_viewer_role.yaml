# This rule is not used by the project deployment-custom-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dpscaler.sarthak.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: deployment-custom-operator
    app.kubernetes.io/managed-by: kustomize
  name: deploymentcustomoperator-viewer-role
rules:
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dpscaler.sarthak.dev
  resources:
  - deploymentcustomoperators/status
  verbs:
  - get
